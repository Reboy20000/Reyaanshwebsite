<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="6; url=/" />
    <title>404 | reyaanshs.com</title>
    <style>
      :root {
        --blue: #0078d7;
        --text: #f7fbff;
        --muted: rgba(255, 255, 255, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--blue);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 7vw;
      }

      .screen {
        width: min(980px, 100%);
      }

      .face {
        margin: 0 0 34px;
        font-size: clamp(5rem, 13vw, 9.5rem);
        font-weight: 300;
        line-height: 0.85;
      }

      h1 {
        max-width: 880px;
        margin: 0 0 28px;
        font-size: clamp(1.6rem, 3.6vw, 2.75rem);
        font-weight: 350;
        line-height: 1.25;
      }

      p {
        max-width: 760px;
        margin: 0 0 18px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.35rem);
        line-height: 1.5;
      }

      .code {
        margin-top: 34px;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: clamp(0.9rem, 1.6vw, 1.05rem);
      }

      a {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .progress {
        width: min(420px, 100%);
        height: 8px;
        margin: 26px 0 8px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        overflow: hidden;
      }

      .bar {
        height: 100%;
        width: 100%;
        background: var(--text);
        transform-origin: left;
        animation: drain 6s linear forwards;
      }

      @keyframes drain {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      @media (max-width: 640px) {
        main {
          align-items: flex-start;
          padding: 48px 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="screen" aria-label="404 error">
        <div class="face">:(</div>
        <h1>
          Your request ran into a problem and needs to restart.
          The page you were looking for does not exist.
        </h1>
        <p>
          We are collecting exactly 0% useful error info, then sending you back to
          reyaanshs.com.
        </p>
        <div class="progress" aria-hidden="true">
          <div class="bar"></div>
        </div>
        <p class="code">
          Stop code: PAGE_NOT_FOUND<br />
          Redirecting in a few seconds. <a href="/">Go home now</a>
        </p>
      </section>
    </main>
    <script>
      window.setTimeout(() => {
        window.location.href = "/";
      }, 6000);
    </script>
  </body>
</html>
